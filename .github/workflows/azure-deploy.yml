name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js for frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. Build frontend
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_OPENAI_API_KEY: DGWYtFjnC6CeNJ9cv378lUHty47sEFQULuplHIdHdFDAmCq1DkhaJQQJ99BBACHYHv6XJ3w3AAAAACOGDJcY
          VITE_OPENAI_ENDPOINT_URI: https://soura-m78qs14x-eastus2.services.ai.azure.com/
          VITE_AZURE_OPENAI_DEPLOYMENT: gpt-5.2-chat
          VITE_AZURE_OPENAI_API_VERSION: 2024-12-01-preview

      # 4. Move frontend to backend/static
      - name: Copy frontend to backend
        run: |
          mkdir -p backend/static
          cp -r frontend/dist/* backend/static/
          echo "✅ Frontend copied to backend/static"

      # 5. Deploy to Azure (Azure will auto-build Python)
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "ramen-art-hackathon"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend

      # 6. Wait and verify
      - name: Wait for deployment
        run: sleep 90

      - name: Check deployment status
        run: |
          echo "🔍 Checking app..."
          curl -I https://ramen-art-hackathon.azurewebsites.net || echo "App starting..."
