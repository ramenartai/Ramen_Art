name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js for frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # 3. Build frontend
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_OPENAI_API_KEY: DGWYtFjnC6CeNJ9cv378lUHty47sEFQULuplHIdHdFDAmCq1DkhaJQQJ99BBACHYHv6XJ3w3AAAAACOGDJcY
          VITE_OPENAI_ENDPOINT_URI: https://soura-m78qs14x-eastus2.services.ai.azure.com/
          VITE_AZURE_OPENAI_DEPLOYMENT: gpt-5.2-chat
          VITE_AZURE_OPENAI_API_VERSION: 2024-12-01-preview

      # 4. Move frontend to backend/static
      - name: Copy frontend to backend
        run: |
          mkdir -p backend/static
          cp -r frontend/dist/* backend/static/

      # 5. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 6. Create virtual environment and install dependencies
      - name: Create virtual environment and install dependencies
        working-directory: ./backend
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Create startup script for Linux App Service
      - name: Create startup script
        working-directory: ./backend
        run: |
          cat > startup.sh << 'EOF'
          #!/bin/bash
          
          echo "=== Starting Ramen Art AI Application ==="
          
          # Activate virtual environment
          source /home/site/wwwroot/antenv/bin/activate
          
          # Start Gunicorn
          gunicorn app.main:app \
            --workers 2 \
            --worker-class uvicorn.workers.UvicornWorker \
            --bind 0.0.0.0:8000 \
            --timeout 120 \
            --access-logfile - \
            --error-logfile - \
            --log-level info
          EOF
          
          chmod +x startup.sh

      # 8. Deploy to Azure Web App
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "ramen-art-hackathon"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./backend

      # 9. Verify deployment
      - name: Wait for deployment to settle
        run: sleep 60

      - name: Check if app is running
        run: |
          echo "🔍 Checking app status..."
          for i in {1..5}; do
            if curl -f https://ramen-art-hackathon.azurewebsites.net/docs; then
              echo "✅ App is running!"
              exit 0
            fi
            echo "⏳ Attempt $i/5 failed, waiting..."
            sleep 20
          done
          echo "⚠️ App may still be starting. Check Azure logs."